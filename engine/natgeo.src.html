<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }

  /* Variáveis de tema: definidas inline em cada .page pelo renderizador */
  .page {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Lato", sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 70%);
    -webkit-font-smoothing: antialiased;
    --display: "Montserrat";
  }
  .page.serif { --display: "Playfair Display"; }

  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .scrim { position: absolute; inset: 0; }
  .sharp { color: #fff; }
  .sharp .scrim { background: linear-gradient(to bottom, rgba(0,0,0,.50) 0%, rgba(0,0,0,0) 22%), linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.70) 38%, rgba(0,0,0,.25) 62%, rgba(0,0,0,0) 80%); }

  .masthead {
    position: absolute; top: 56px; left: 64px; z-index: 2;
    font-family: "Montserrat"; font-weight: 600; font-size: 20px;
    letter-spacing: .32em; text-transform: uppercase;
  }
  .handle { position: absolute; right: 64px; bottom: 56px; z-index: 2; font-size: 18px; letter-spacing: .08em; opacity: .75; }
  .pageno { position: absolute; left: 64px; bottom: 56px; z-index: 2; font-family: "DM Mono"; font-size: 17px; letter-spacing: .1em; opacity: .55; }
  .kicker {
    font-family: "Montserrat"; font-weight: 600; font-size: 18px;
    letter-spacing: .3em; text-transform: uppercase; color: var(--mute); margin-bottom: 26px;
  }

  /* ---------- CAPA ---------- */
  .cover .text { position: absolute; left: 64px; right: 120px; bottom: 96px; z-index: 2; }
  .cover h1 {
    font-family: var(--display); font-weight: 700; font-size: 60px; line-height: 1.08;
    text-transform: uppercase; letter-spacing: .01em; max-width: 840px;
    text-shadow: 0 2px 18px rgba(0,0,0,.35);
  }
  .serif .cover h1, .cover.serif h1 { text-transform: none; font-size: 68px; font-weight: 800; letter-spacing: 0; line-height: 1.05; }
  .cover .dek { margin-top: 22px; font-size: 27px; line-height: 1.4; max-width: 720px; opacity: .92; }
  .cover .swipe { position: absolute; right: 64px; bottom: 96px; z-index: 2; font-family: "Montserrat"; font-weight: 600; font-size: 16px; letter-spacing: .25em; text-transform: uppercase; opacity: .8; }

  /* ---------- FOTO NÍTIDA: texto no terço inferior ---------- */
  .sharp .content { position: absolute; left: 64px; right: 96px; bottom: 120px; z-index: 2; }
  .sharp .kicker { color: rgba(255,255,255,.72); }
  .sharp h2 { font-family: var(--display); font-weight: 700; font-size: 50px; line-height: 1.15; max-width: 860px; margin-bottom: 26px; }
  .sharp p { font-size: 30px; line-height: 1.5; max-width: 860px; margin-bottom: 22px; color: rgba(255,255,255,.94); }
  .sharp .cap { position: absolute; top: 100px; right: 64px; font-size: 17px; color: rgba(255,255,255,.6); letter-spacing: .04em; z-index: 2; }

  /* ---------- PÁGINA DE TEMA: conteúdo centralizado ---------- */
  .soft .content { position: absolute; left: 64px; right: 96px; top: 140px; bottom: 120px; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
  .soft.top .content { justify-content: flex-start; padding-top: 40px; }
  .soft h2 { font-family: var(--display); font-weight: 700; font-size: 50px; line-height: 1.15; max-width: 880px; margin-bottom: 38px; }
  .serif h2 { font-size: 56px; }
  .soft p { font-size: 30px; line-height: 1.5; max-width: 860px; margin-bottom: 24px; }
  .soft p.lead { font-size: 36px; line-height: 1.4; font-weight: 400; }
  .soft p.small { font-size: 24px; color: var(--mute); }
  b, strong { font-weight: 700; }
  mark { background: none; color: var(--accent); font-weight: 700; }

  ul.list { list-style: none; max-width: 860px; margin-bottom: 24px; }
  ul.list li { font-size: 29px; line-height: 1.45; padding: 14px 0 14px 40px; position: relative; border-top: 1px solid var(--rule); }
  ul.list li:last-child { border-bottom: 1px solid var(--rule); }
  ul.list li::before { content: ""; position: absolute; left: 4px; top: 30px; width: 12px; height: 12px; background: var(--accent); }

  /* checklist com marca */
  ul.check { list-style: none; max-width: 860px; }
  ul.check li { font-size: 29px; line-height: 1.45; padding: 16px 0 16px 64px; position: relative; border-top: 1px solid var(--rule); }
  ul.check li:last-child { border-bottom: 1px solid var(--rule); }
  ul.check li::before { content: "✓"; position: absolute; left: 6px; top: 14px; font-family: "Montserrat"; font-weight: 700; font-size: 30px; color: var(--accent); }
  ul.check.no li::before { content: "✕"; }

  /* número-herói */
  .stat .big { font-family: var(--display); font-weight: 700; font-size: 210px; line-height: .95; letter-spacing: -.02em; color: var(--accent); margin: 6px 0 6px; }
  .stat .big small { font-size: 96px; letter-spacing: 0; }
  .stat .label { font-family: "Montserrat"; font-weight: 600; font-size: 25px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 40px; }

  /* dois números lado a lado */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; max-width: 920px; margin: 6px 0 34px; }
  .split .cell { border-top: 4px solid var(--accent); padding-top: 24px; }
  .split .cell.b { border-top-color: var(--rule2); }
  .split .big { font-family: var(--display); font-weight: 700; font-size: 128px; line-height: .95; letter-spacing: -.02em; color: var(--accent); }
  .split .cell.b .big { color: var(--ink); }
  .split .big small { font-size: 60px; }
  .split .label { font-family: "Montserrat"; font-weight: 600; font-size: 21px; letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 16px; }
  .split .text { font-size: 25px; line-height: 1.45; color: var(--mute); }

  /* gráfico de barras horizontais */
  .chart { max-width: 900px; margin: 6px 0 34px; font-family: "Lato"; }
  .chart .row { display: grid; grid-template-columns: 320px 1fr 110px; align-items: center; gap: 20px; min-height: 64px; padding: 6px 0; }
  .chart .row .name { font-size: 25px; line-height: 1.2; }
  .chart .row .bar { height: 28px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .chart .row.other .bar { background: var(--rule2); }
  .chart .row .val { font-family: "DM Mono"; font-weight: 500; font-size: 24px; }
  .chart .note { font-size: 19px; color: var(--mute); margin-top: 16px; }

  /* gráfico divergente: negativo para a esquerda, positivo para a direita */
  .dchart { max-width: 920px; margin: 6px 0 30px; }
  .dchart .row { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 20px; min-height: 90px; padding: 8px 0; }
  .dchart .row .name { font-size: 24px; line-height: 1.25; }
  .dchart .row .track { position: relative; height: 34px; }
  .dchart .row .track::before { content: ""; position: absolute; left: 50%; top: -8px; bottom: -8px; width: 2px; background: var(--rule2); }
  .dchart .row .bar { position: absolute; top: 0; height: 34px; background: var(--accent); }
  .dchart .row .bar.neg { right: 50%; border-radius: 4px 0 0 4px; }
  .dchart .row .bar.pos { left: 50%; border-radius: 0 4px 4px 0; background: var(--ink); opacity: .55; }
  .dchart .row .ci { position: absolute; top: 15px; height: 4px; background: var(--ink); opacity: .35; }
  .dchart .row .val { position: absolute; top: -30px; line-height: 1; font-family: "DM Mono"; font-weight: 500; font-size: 21px; }
  .dchart .axis { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 8px; }
  .dchart .axis div { display: flex; justify-content: space-between; font-family: "DM Mono"; font-size: 18px; color: var(--mute); }
  .dchart .note { font-size: 19px; color: var(--mute); margin-top: 14px; }

  /* linha do tempo */
  .timeline { max-width: 880px; margin-bottom: 16px; }
  .timeline .item { display: grid; grid-template-columns: 170px 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--rule); }
  .timeline .item:last-child { border-bottom: 1px solid var(--rule); }
  .timeline .when { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--accent); line-height: 1.3; }
  .timeline .what { font-size: 27px; line-height: 1.4; }

  /* exemplo */
  .example { border-left: 6px solid var(--accent); padding: 6px 0 6px 32px; max-width: 860px; margin: 6px 0 30px; }
  .example .tag { font-family: "Montserrat"; font-weight: 600; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .example p { font-size: 29px; line-height: 1.45; margin-bottom: 12px; }
  .example p:last-child { margin-bottom: 0; }

  /* passos */
  .steps { max-width: 880px; }
  .steps .step { display: grid; grid-template-columns: 84px 1fr; gap: 20px; padding: 20px 0; border-top: 1px solid var(--rule); align-items: start; }
  .steps .step:last-child { border-bottom: 1px solid var(--rule); }
  .steps .n { font-family: var(--display); font-weight: 700; font-size: 44px; color: var(--accent); line-height: 1; }
  .steps .t { font-family: "Montserrat"; font-weight: 600; font-size: 27px; margin-bottom: 6px; }
  .steps .d { font-size: 26px; line-height: 1.4; color: var(--mute2); }

  /* comparação */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 900px; margin: 6px 0 30px; }
  .compare .col { border-top: 4px solid var(--accent); padding-top: 20px; }
  .compare .col.b { border-top-color: var(--rule2); }
  .compare .col h3 { font-family: "Montserrat"; font-weight: 700; font-size: 28px; margin-bottom: 16px; }
  .compare .col p { font-size: 25px; line-height: 1.45; margin-bottom: 12px; max-width: none; }

  /* citação grande */
  .quote .q { font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1.2; max-width: 900px; margin-bottom: 36px; }
  .serif .quote .q, .quote.serif .q { font-weight: 400; font-style: italic; font-size: 64px; }
  .quote .q::before { content: "“"; color: var(--accent); }
  .quote .q::after { content: "”"; color: var(--accent); }
  .quote .who { font-family: "Montserrat"; font-weight: 600; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }

  /* ficha (cartão de biblioteca) */
  .card { max-width: 880px; border: 2px solid var(--rule2); padding: 36px 40px; margin: 6px 0 34px; }
  .card .row { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 14px 0; border-top: 1px solid var(--rule); font-size: 26px; line-height: 1.4; }
  .card .row:first-child { border-top: none; padding-top: 0; }
  .card .row .k { font-family: "DM Mono"; font-weight: 500; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding-top: 6px; }

  /* medidor de pontos (ex.: 37 de 100) */
  .meter { margin: 6px 0 30px; }
  .meter .dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 10px; max-width: 900px; }
  .meter .dots i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--rule2); }
  .meter .dots i.on { background: var(--accent); }
  .meter .legend { display: flex; gap: 36px; margin-top: 22px; font-size: 22px; color: var(--mute); }
  .meter .legend i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; vertical-align: -1px; background: var(--rule2); }
  .meter .legend i.on { background: var(--accent); }

  /* diagrama SVG */
  .diagram { max-width: 920px; margin: 4px 0 28px; }
  .diagram svg { width: 100%; height: auto; display: block; overflow: hidden; }
  .diagram text { font-family: "Lato"; }
  .diagram .mono { font-family: "DM Mono"; }
  .diagram .cap { font-size: 20px; color: var(--mute); margin-top: 14px; }

  /* fontes */
  .sources li { list-style: none; font-size: 27px; line-height: 1.4; padding: 22px 0; border-top: 1px solid var(--rule); max-width: 880px; }
  .sources li:last-child { border-bottom: 1px solid var(--rule); }
  .sources li span { display: block; font-size: 21px; color: var(--mute); margin-top: 4px; }
</style>
</head>
<body>
<!-- CONTENT -->
</body>
</html>
