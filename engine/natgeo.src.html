<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  :root { --accent: #9CC8E8; --ink: #FFFFFF; --mute: rgba(255,255,255,.72); --rule: rgba(255,255,255,.22); }

  .page {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Lato", sans-serif; color: #fff; background: #000;
    -webkit-font-smoothing: antialiased;
  }

  /* fundo fotográfico: nítido (capa e páginas de foto) ou desfocado (páginas de texto e dados) */
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .scrim { position: absolute; inset: 0; }
  .sharp .scrim { background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.70) 38%, rgba(0,0,0,.25) 62%, rgba(0,0,0,0) 80%); }
  .soft .scrim { background: none; }

  .masthead {
    position: absolute; top: 56px; left: 64px; z-index: 2;
    font-family: "Montserrat"; font-weight: 600; font-size: 20px;
    letter-spacing: .32em; text-transform: uppercase; color: #fff;
  }
  .handle { position: absolute; right: 64px; bottom: 56px; z-index: 2; font-size: 18px; letter-spacing: .08em; opacity: .85; }
  .kicker {
    font-family: "Montserrat"; font-weight: 600; font-size: 18px;
    letter-spacing: .3em; text-transform: uppercase; color: var(--mute); margin-bottom: 26px;
  }

  /* ---------- CAPA ---------- */
  .cover .text { position: absolute; left: 64px; right: 120px; bottom: 96px; z-index: 2; }
  .cover h1 {
    font-family: "Montserrat"; font-weight: 700; font-size: 58px; line-height: 1.1;
    text-transform: uppercase; letter-spacing: .01em; max-width: 820px;
    text-shadow: 0 2px 18px rgba(0,0,0,.35);
  }
  .cover .dek { margin-top: 22px; font-size: 27px; line-height: 1.4; max-width: 720px; opacity: .92; }

  /* ---------- PÁGINA DE FOTO NÍTIDA: texto no terço inferior ---------- */
  .sharp .content { position: absolute; left: 64px; right: 96px; bottom: 120px; z-index: 2; }
  .sharp h2 { font-family: "Montserrat"; font-weight: 700; font-size: 50px; line-height: 1.15; max-width: 860px; margin-bottom: 26px; }
  .sharp p { font-size: 30px; line-height: 1.5; max-width: 860px; margin-bottom: 22px; color: rgba(255,255,255,.94); }
  .sharp .cap { position: absolute; top: 100px; right: 64px; font-size: 17px; color: rgba(255,255,255,.6); letter-spacing: .04em; z-index: 2; }

  /* ---------- PÁGINA DESFOCADA: conteúdo no topo, área inteira ---------- */
  .soft .content { position: absolute; left: 64px; right: 96px; top: 140px; bottom: 120px; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
  .soft h2 { font-family: "Montserrat"; font-weight: 700; font-size: 50px; line-height: 1.15; max-width: 860px; margin-bottom: 38px; }
  .soft p { font-size: 30px; line-height: 1.5; max-width: 860px; margin-bottom: 24px; color: rgba(255,255,255,.94); }

  ul.list { list-style: none; max-width: 860px; margin-bottom: 24px; }
  ul.list li { font-size: 29px; line-height: 1.45; padding: 14px 0 14px 40px; position: relative; border-top: 1px solid var(--rule); }
  ul.list li:last-child { border-bottom: 1px solid var(--rule); }
  ul.list li::before { content: ""; position: absolute; left: 4px; top: 30px; width: 12px; height: 12px; background: var(--accent); }

  /* número-herói */
  .stat .big { font-family: "Montserrat"; font-weight: 700; font-size: 200px; line-height: .95; letter-spacing: -.02em; color: var(--accent); margin: 6px 0 6px; }
  .stat .big small { font-size: 92px; letter-spacing: 0; }
  .stat .label { font-family: "Montserrat"; font-weight: 600; font-size: 25px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 40px; }

  /* gráfico de barras horizontais */
  .chart { max-width: 888px; margin: 6px 0 34px; }
  .chart .row { display: grid; grid-template-columns: 300px 1fr 120px; align-items: center; gap: 20px; height: 64px; }
  .chart .row .name { font-size: 25px; line-height: 1.2; color: rgba(255,255,255,.92); }
  .chart .row .bar { height: 28px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .chart .row.other .bar { background: rgba(255,255,255,.35); }
  .chart .row .val { font-family: "Montserrat"; font-weight: 600; font-size: 24px; }
  .chart .note { font-size: 19px; color: var(--mute); margin-top: 16px; }

  /* linha do tempo */
  .timeline { max-width: 860px; margin-bottom: 16px; }
  .timeline .item { display: grid; grid-template-columns: 160px 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--rule); }
  .timeline .item:last-child { border-bottom: 1px solid var(--rule); }
  .timeline .when { font-family: "Montserrat"; font-weight: 700; font-size: 30px; color: var(--accent); line-height: 1.3; }
  .timeline .what { font-size: 27px; line-height: 1.4; color: rgba(255,255,255,.92); }

  /* exemplo concreto */
  .example { border-left: 6px solid var(--accent); padding: 6px 0 6px 32px; max-width: 860px; margin: 6px 0 30px; }
  .example .tag { font-family: "Montserrat"; font-weight: 600; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .example p { font-size: 29px; line-height: 1.45; margin-bottom: 12px; }
  .example p:last-child { margin-bottom: 0; }

  /* passos numerados */
  .steps { max-width: 860px; }
  .steps .step { display: grid; grid-template-columns: 84px 1fr; gap: 20px; padding: 20px 0; border-top: 1px solid var(--rule); align-items: start; }
  .steps .step:last-child { border-bottom: 1px solid var(--rule); }
  .steps .n { font-family: "Montserrat"; font-weight: 700; font-size: 44px; color: var(--accent); line-height: 1; }
  .steps .t { font-family: "Montserrat"; font-weight: 600; font-size: 27px; margin-bottom: 6px; }
  .steps .d { font-size: 26px; line-height: 1.4; color: rgba(255,255,255,.86); }

  /* comparação lado a lado */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 888px; margin: 6px 0 30px; }
  .compare .col { border-top: 4px solid var(--accent); padding-top: 20px; }
  .compare .col.b { border-top-color: rgba(255,255,255,.4); }
  .compare .col h3 { font-family: "Montserrat"; font-weight: 700; font-size: 28px; margin-bottom: 16px; }
  .compare .col p { font-size: 25px; line-height: 1.45; margin-bottom: 12px; max-width: none; }

  /* fontes */
  .sources li { list-style: none; font-size: 27px; line-height: 1.4; padding: 22px 0; border-top: 1px solid var(--rule); max-width: 860px; }
  .sources li:last-child { border-bottom: 1px solid var(--rule); }
  .sources li span { display: block; font-size: 21px; color: var(--mute); margin-top: 4px; }
</style>
</head>
<body>
<!-- CONTENT -->
</body>
</html>
