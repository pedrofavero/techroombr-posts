name: publicar

# Publica no Instagram pela API oficial (login unificado, token SUAT) sem Metricool.
# - A cada 10 min (o agendador do GitHub atrasa e às vezes pula rodadas): publica os itens vencidos de fila-publicacao/*.json ("due").
# - Manual (Run workflow): me | debug | limit | due | carousel <slug> | reel <slug>.
# Secrets: IG_USER_ID, IG_ACCESS_TOKEN, IG_APP_ID, IG_APP_SECRET (ver SETUP.md).

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      comando:
        description: "O que fazer"
        type: choice
        default: me
        options: [me, debug, limit, due, carousel, reel]
      slug:
        description: "slug do post (só para carousel/reel)"
        required: false
        default: ""
      dry_run:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q pillow

      - name: Executar
        run: |
          set -e
          CMD="${{ github.event.inputs.comando || 'due' }}"
          SLUG="${{ github.event.inputs.slug }}"
          DRY=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          case "$CMD" in
            carousel|reel) python3 engine/publish_ig.py "$CMD" "$SLUG" $DRY ;;
            *)             python3 engine/publish_ig.py "$CMD" $DRY ;;
          esac

      - name: Registrar no repositório (histórico e fila)
        if: always()
        run: |
          git config user.name "techroom-bot"
          git config user.email "bot@techroombr.local"
          git add posts/historico.csv fila-publicacao || true
          git diff --cached --quiet && { echo "nada a registrar"; exit 0; }
          git commit -m "publicar: registro automático"
          git pull --rebase origin main
          git push origin HEAD:main
